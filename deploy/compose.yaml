# Dokploy: Docker Compose mode, repository root as the checkout directory.
# All seven services run on one host; sandbox has no public ports or data mounts.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# go-judge를 뺀 모든 서비스에 적용합니다. 이미지별로 실제로 필요한 권한만 cap_add로 되돌립니다.
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    <<: *hardening
    # 진입점이 데이터 디렉터리 소유권을 맞춘 뒤 postgres 사용자로 내려갈 때 필요한 권한입니다.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPUS:-2.0}
    pids_limit: 256
    environment:
      POSTGRES_DB: unsolvable_oj
      POSTGRES_USER: unsolvable
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random hex PostgreSQL password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unsolvable -d unsolvable_oj"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # 하루 한 번(그리고 기동할 때마다) 같은 호스트의 볼륨에 pg_dump하고 BACKUP_KEEP_DAYS일보다 오래된 덤프를 지웁니다.
  postgres-backup:
    image: postgres:17.11-alpine
    init: true
    restart: unless-stopped
    # root로 실행되지만 추가 권한 없이 자기 소유의 백업 볼륨만 씁니다.
    <<: *hardening
    mem_limit: ${BACKUP_MEMORY_LIMIT:-256m}
    cpus: ${BACKUP_CPUS:-0.5}
    pids_limit: 64
    environment:
      PGHOST: postgres
      PGUSER: unsolvable
      PGDATABASE: unsolvable_oj
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set a random hex PostgreSQL password}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        while :; do
          file="/backups/unsolvable-oj-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          # 실패한 덤프로 정상 백업을 밀어내지 않도록 성공했을 때만 보존 기간을 적용합니다.
          if pg_dump -Fc -f "$$file.partial"; then
            mv "$$file.partial" "$$file"
            find /backups -name 'unsolvable-oj-*' -mtime +"$$BACKUP_KEEP_DAYS" -delete
            echo "Backup written: $$file"
          else
            rm -f "$$file.partial"
            echo "Backup failed" >&2
          fi
          sleep 86400
        done
    volumes:
      - postgres-backups:/backups
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 26시간 안에 성공한 덤프가 없으면 unhealthy로 표시합니다.
      test: ["CMD-SHELL", "find /backups -name 'unsolvable-oj-*.dump' -mmin -1560 | grep -q ."]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 5m
    logging: *logging

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    <<: *hardening
    # 셸로 바로 실행해 지금까지처럼 root로 동작합니다. 이미지가 만든 redis 소유 /data에 쓰려면 이 권한만 필요합니다.
    cap_add: [DAC_OVERRIDE]
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    cpus: ${REDIS_CPUS:-1.0}
    pids_limit: 64
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a private Redis password}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
    command:
      - /bin/sh
      - -ec
      # 비밀번호를 명령 인자 대신 표준 입력 설정으로 넘겨 프로세스 목록에 남기지 않습니다.
      # 설정 문법상 비밀번호에 큰따옴표·역슬래시를 쓰지 마세요(hex 권장).
      - |
        exec redis-server - --appendonly yes --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy noeviction <<EOF
        requirepass "$$REDIS_PASSWORD"
        EOF
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --raw ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  back:
    build:
      context: ../Back
    init: true
    restart: unless-stopped
    <<: *hardening
    mem_limit: ${BACK_MEMORY_LIMIT:-1g}
    cpus: ${BACK_CPUS:-2.0}
    pids_limit: 256
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY: uniquelocal
      CORS_ORIGIN: ${PUBLIC_ORIGIN:?Set the public HTTPS origin without a trailing slash}
      # Hex passwords need no URL escaping. Do not use the development password.
      DATABASE_URL: postgresql://unsolvable:${POSTGRES_PASSWORD:?Set a random hex PostgreSQL password}@postgres:5432/unsolvable_oj
      DATABASE_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a private Redis password}
      REDIS_DB: 0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set a random JWT signing secret}
      JWT_ACCESS_EXPIRES_IN: 15m
      JUDGE_SERVICE_TOKEN: ${JUDGE_SERVICE_TOKEN:?Set the shared API and worker token}
    networks: [app, data]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    logging: *logging

  go-judge:
    build:
      context: ../Judge/runtime
    privileged: true
    # no-new-privileges·cap_drop·pids_limit은 적용하지 않습니다. 중첩 sandbox가 자체 cgroup으로 제한하며
    # 컨테이너 단위 pids 상한은 JVM·컴파일러 스레드 때문에 정상 채점을 실패시킬 수 있습니다.
    restart: unless-stopped
    shm_size: 512m
    mem_limit: ${SANDBOX_MEMORY_LIMIT:-10g}
    # Equal RAM and combined RAM+swap limits disable swap at container creation.
    memswap_limit: ${SANDBOX_MEMORY_LIMIT:-10g}
    cgroup: private
    cpus: ${SANDBOX_CPUS:-2.0}
    networks: [sandbox]
    environment:
      ES_AUTH_TOKEN: ${GO_JUDGE_TOKEN:?Set a separate sandbox authentication token}
    command:
      - -no-fallback
      - -enable-cpu-rate
      - -parallelism=${JUDGE_CONCURRENCY:-2}
      - -file-timeout=15m
      - -time-limit-checker-interval=2ms
      - -output-limit=64m
      - -copy-out-limit=64m
    # The runtime image supplies a cgroup/seccomp/authentication healthcheck.
    logging: *logging

  judge:
    build:
      context: ../Judge
    init: true
    restart: unless-stopped
    <<: *hardening
    mem_limit: ${JUDGE_MEMORY_LIMIT:-512m}
    cpus: ${JUDGE_CPUS:-1.0}
    pids_limit: 128
    stop_grace_period: 2m
    environment:
      API_BASE_URL: http://back:3000/api/v1
      JUDGE_SERVICE_TOKEN: ${JUDGE_SERVICE_TOKEN:?Set the shared API and worker token}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a private Redis password}
      REDIS_DB: 0
      GO_JUDGE_URL: http://go-judge:5050
      GO_JUDGE_TOKEN: ${GO_JUDGE_TOKEN:?Set a separate sandbox authentication token}
      JUDGE_CONCURRENCY: ${JUDGE_CONCURRENCY:-2}
    networks: [data, sandbox]
    depends_on:
      back:
        condition: service_healthy
      redis:
        condition: service_healthy
      go-judge:
        condition: service_healthy
    logging: *logging

  front:
    build:
      context: ../Front
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    <<: *hardening
    # nginx master(root)가 작업 프로세스를 nginx 사용자로 띄우고 80번 포트를 엽니다.
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    mem_limit: ${FRONT_MEMORY_LIMIT:-128m}
    cpus: ${FRONT_CPUS:-1.0}
    # nginx 작업 프로세스 수는 호스트 CPU 수를 따릅니다.
    pids_limit: 128
    environment:
      # Obtain the real subnet from docker network inspect dokploy-network.
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:?Set the Dokploy Traefik network subnet}
      TRUSTED_PROXY_HOP_CIDR: ${TRUSTED_PROXY_HOP_CIDR:-127.0.0.1/32}
    expose: ["80"]
    networks: [app, dokploy-network]
    depends_on:
      back:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

volumes:
  postgres-data:
  postgres-backups:
  redis-data:

networks:
  app: {}
  data: {}
  sandbox:
    internal: true
  dokploy-network:
    external: true
