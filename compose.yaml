services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: unsolvable_oj
      POSTGRES_USER: unsolvable
      POSTGRES_PASSWORD: local_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unsolvable -d unsolvable_oj"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # NestJS API. Runs pending TypeORM migrations on startup, then serves
  # http://localhost:3000/api/v1 (Swagger at /docs).
  back:
    build:
      context: ./Back
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # Only private-network proxies are trusted; nginx overwrites forwarded IPs.
      TRUST_PROXY: uniquelocal
      CORS_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://unsolvable:local_password@postgres:5432/unsolvable_oj
      DATABASE_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      JWT_ACCESS_SECRET: local-dev-only-jwt-access-secret-0123456789ab
      JWT_ACCESS_EXPIRES_IN: 15m
      # Must match the judge service's JUDGE_SERVICE_TOKEN below.
      JUDGE_SERVICE_TOKEN: local-dev-only-judge-service-token-0123456789
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # Privileged nested sandbox: local development only. Production needs a
  # dedicated Linux execution host; never expose this API to the public network.
  go-judge:
    build:
      context: ./Judge/runtime
    image: unsolvable-go-judge:local
    privileged: true
    shm_size: 512m
    environment:
      ES_AUTH_TOKEN: ${GO_JUDGE_TOKEN:-local-dev-only-go-judge-token-0123456789abcdef}
    command:
      - -no-fallback
      - -enable-cpu-rate
      - -parallelism=2
      - -file-timeout=15m
      - -time-limit-checker-interval=2ms
      - -output-limit=64m
      - -copy-out-limit=64m
    ports:
      - "127.0.0.1:5050:5050"
    networks: [sandbox]

  # Only the worker can reach both the application and sandbox networks.
  judge:
    build:
      context: ./Judge
    environment:
      API_BASE_URL: http://back:3000/api/v1
      JUDGE_SERVICE_TOKEN: local-dev-only-judge-service-token-0123456789
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GO_JUDGE_URL: http://go-judge:5050
      GO_JUDGE_TOKEN: ${GO_JUDGE_TOKEN:-local-dev-only-go-judge-token-0123456789abcdef}
      JUDGE_CONCURRENCY: 2
    # 종료 시 진행 중인 채점을 마치도록 기다립니다(기본 10초면 채점 중 SIGKILL).
    stop_grace_period: 2m
    networks: [default, sandbox]
    depends_on:
      redis:
        condition: service_healthy
      back:
        condition: service_healthy
      go-judge:
        condition: service_healthy

  # React/Vite UI, built and served as static files through nginx, which
  # also reverse-proxies /api/ to the back service.
  front:
    build:
      context: ./Front
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      back:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:

networks:
  sandbox: {}
