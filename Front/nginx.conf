upstream unsolvable_api {
    zone unsolvable_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server back:3000 resolve;
}

# 웹 화면의 Content-Security-Policy. 인라인 스크립트는 허용하지 않습니다(테마 초기화는 /theme-init.js).
# - style/font: Pretendard(cdn.jsdelivr.net), JetBrains Mono(fonts.googleapis.com·fonts.gstatic.com), KaTeX 글꼴 일부는 CSS 안 data: 글꼴.
#   style 'unsafe-inline'은 KaTeX·도형의 style 속성을 위한 것입니다(스크립트 실행과 무관).
# - img: 문제 본문 Markdown의 data: 이미지와 외부 https 이미지.
# - connect: 같은 출처 API와 Sentry(VITE_SENTRY_DSN이 *.sentry.io일 때). 다른 Sentry 주소를 쓰면 여기에 더하세요.
map $host $content_security_policy {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.sentry.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # add_header가 있는 location은 이 값을 상속하지 않으므로 아래 location에도 반복합니다.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy $content_security_policy always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # 채점 워커 전용 API는 공개 프록시로 노출하지 않습니다(워커는 back:3000에 직접 접속). Express 경로는 대소문자를 구분하지 않습니다.
    location ~* ^/api/v1/internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://unsolvable_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # helmet 값과 중복되지 않도록 nginx 값만 남깁니다(HSTS·COOP·CORP 등 나머지 helmet 헤더는 그대로 전달).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # Hashed build output: a stale tab must get a 404, not index.html, for a removed chunk.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy $content_security_policy always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    # Revalidate the shell so a new deploy's chunk names are picked up.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy $content_security_policy always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }
}
