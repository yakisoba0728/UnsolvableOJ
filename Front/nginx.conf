upstream unsolvable_api {
    zone unsolvable_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server back:3000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # add_header가 있는 location은 이 값을 상속하지 않으므로 아래 location에도 반복합니다.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # 채점 워커 전용 API는 공개 프록시로 노출하지 않습니다(워커는 back:3000에 직접 접속). Express 경로는 대소문자를 구분하지 않습니다.
    location ~* ^/api/v1/internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://unsolvable_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # helmet 값과 중복되지 않도록 nginx 값만 남깁니다.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
    }

    # Hashed build output: a stale tab must get a 404, not index.html, for a removed chunk.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    # Revalidate the shell so a new deploy's chunk names are picked up.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
}
