services:
  go-judge:
    build: ../runtime
    image: unsolvable-go-judge:local
    privileged: true
    restart: unless-stopped
    shm_size: 512m
    mem_limit: ${SANDBOX_MEMORY_LIMIT:-10g}
    memswap_limit: ${SANDBOX_MEMORY_LIMIT:-10g}
    cgroup: private
    cpus: ${SANDBOX_CPUS:-2.0}
    environment:
      ES_AUTH_TOKEN: ${GO_JUDGE_TOKEN:?Set a private GO_JUDGE_TOKEN}
    command:
      - -no-fallback
      - -enable-cpu-rate
      - -parallelism=${JUDGE_CONCURRENCY:-2}
      - -file-timeout=15m
      - -time-limit-checker-interval=2ms
      - -output-limit=64m
      - -copy-out-limit=64m
  judge:
    build: ..
    # healthcheck가 멈춘 워커를 종료하려면 node가 PID 1이 아니어야 합니다.
    init: true
    mem_limit: ${JUDGE_MEMORY_LIMIT:-512m}
    restart: unless-stopped
    # 종료 시 진행 중인 채점을 마치도록 기다립니다(기본 10초면 채점 중 SIGKILL).
    stop_grace_period: 2m
    environment:
      API_BASE_URL: ${API_BASE_URL:?Set the application API URL}
      JUDGE_SERVICE_TOKEN: ${JUDGE_SERVICE_TOKEN:?Match the application judge token}
      REDIS_HOST: ${REDIS_HOST:?Set the private Redis address}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis authentication is required}
      REDIS_DB: ${REDIS_DB:-0}
      GO_JUDGE_URL: http://go-judge:5050
      GO_JUDGE_TOKEN: ${GO_JUDGE_TOKEN:?Set a private GO_JUDGE_TOKEN}
      JUDGE_CONCURRENCY: ${JUDGE_CONCURRENCY:-2}
    depends_on:
      go-judge:
        condition: service_healthy
